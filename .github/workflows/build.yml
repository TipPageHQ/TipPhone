name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: TipPhone
          path: dist/TipPhone.exe
