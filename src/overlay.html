<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TipPhone overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@800&family=Mulish:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #4ade80; --black: #052e16; --black2: #0f4a2a;
    --ease: cubic-bezier(0.25, 1, 0.5, 1);
  }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { width: 100vw; height: 100vh; position: relative; font-family: "Mulish", "Segoe UI", system-ui, sans-serif; color: var(--black); }

  .card {
    position: absolute; left: 60px; bottom: 60px; display: flex;
    clip-path: inset(0 100% 0 0);
    transition: clip-path 360ms var(--ease);
  }
  body.top .card { top: 60px; bottom: auto; }
  .card.show { clip-path: inset(0 0 0 0); }
  .card.leaving { clip-path: inset(0 0 0 100%); }
  .block { overflow: hidden; background: var(--green); }
  .block.sizing { transition: width 340ms var(--ease), height 340ms var(--ease); }
  .inner { box-sizing: border-box; width: fit-content; min-width: 620px; max-width: 1000px; padding: 22px 30px 24px 28px; }

  .line { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 19px; line-height: 1; color: var(--black2); }
  .line svg { width: 20px; height: 20px; fill: var(--black); flex: none; }
  .ringing .line svg { animation: wiggle 1.2s infinite; transform-origin: 50% 50%; }
  @keyframes wiggle {
    0%, 50%, 100% { transform: rotate(0); }
    5%, 15%, 25%, 35%, 45% { transform: rotate(-14deg); }
    10%, 20%, 30%, 40% { transform: rotate(14deg); }
  }
  .line time { font-variant-numeric: tabular-nums; }

  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 28px; margin-top: 8px; }
  .title, .amount { font-family: "Sofia Sans", "Segoe UI", system-ui, sans-serif; font-weight: 800; letter-spacing: -0.012em; line-height: 0.98; }
  .title { font-size: 46px; min-width: 0; overflow-wrap: anywhere; }
  .amount { font-size: 46px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .amount:empty { display: none; }
  .message {
    font-size: 24px; font-weight: 600; line-height: 1.3; margin-top: 12px; color: var(--black);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .message:empty { display: none; }
  .ended .line, .missed .line { color: var(--black); }

  /* text swaps fade in */
  .fade { animation: fadein 220ms var(--ease) both; }
  .message.fade { animation: fadein 260ms var(--ease) 140ms both; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  /* shown in a normal tab so a preview isn't blank. obs never gets it */
  .hint {
    position: fixed; right: 24px; bottom: 20px; display: none; padding: 8px 12px; border-radius: 4px;
    background: #1a1c20; color: #bdc9c2; font: 600 15px/1.4 "Mulish", "Segoe UI", system-ui, sans-serif;
  }
  .hint b { color: #e2e2e8; }
  body.tab .hint { display: block; }

  @media (prefers-reduced-motion: reduce) {
    .card { transition: opacity 200ms; clip-path: none; opacity: 0; }
    .card.show { opacity: 1; }
    .card.leaving { opacity: 0; }
    .block.sizing { transition: none; }
    .ringing .line svg { animation: none; }
    .fade, .message.fade { animation: none; }
  }
</style>
</head>
<body>
<div class="hint" id="hint"><b>TipPhone overlay.</b> Connected and waiting for a call. This line doesn't show in OBS.</div>
<div class="card" id="card">
  <div class="block" id="block">
   <div class="inner" id="inner">
    <div class="line">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg>
      <span id="label"></span>
    </div>
    <div class="row">
      <div class="title" id="title"></div>
      <div class="amount" id="amount"></div>
    </div>
    <div class="message" id="message"></div>
   </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
if (new URLSearchParams(location.search).get("pos") === "top") document.body.classList.add("top");
const inObs = /\bOBS\/|Streamlabs/i.test(navigator.userAgent);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

let hideTimer = null;
let clock = null;
let leaveTimer = null;
let callStart = 0;
let sizeTimer = null;
const mmss = (ms) => { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

const block = $("block");
const inner = $("inner");

// ---- the card's colour ----

// the default keeps the hand-picked dark greens. any other colour gets ink mixed
// from itself: towards black on a light colour, towards white on a dark one
const DEFAULT_COLOR = "#4ade80";
let shownColor = null;
function applyColor(hex) {
  if (!/^#[0-9a-f]{6}$/i.test(hex || "") || hex.toLowerCase() === shownColor) return;
  shownColor = hex.toLowerCase();
  const root = document.documentElement.style;
  if (shownColor === DEFAULT_COLOR) {
    root.removeProperty("--green");
    root.removeProperty("--black");
    root.removeProperty("--black2");
    return;
  }
  const rgb = [1, 3, 5].map((i) => parseInt(shownColor.slice(i, i + 2), 16));
  const lin = rgb.map((c) => { const s = c / 255; return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4; });
  const luminance = 0.2126 * lin[0] + 0.7152 * lin[1] + 0.0722 * lin[2];
  const towards = luminance > 0.3 ? 0 : 255;
  const mix = (amount) => "rgb(" + rgb.map((c) => Math.round(c + (towards - c) * amount)).join(",") + ")";
  root.setProperty("--green", shownColor);
  root.setProperty("--black", mix(towards ? 0.9 : 0.82));
  root.setProperty("--black2", mix(towards ? 0.75 : 0.68));
}

// ---- what the card says ----

// animate the block from its old size to its new one. the words are pinned at their
// final width the whole time so they never rewrap while the box is moving
function resize(change) {
  const shown = $("card").classList.contains("show");
  const before = block.getBoundingClientRect();
  block.classList.remove("sizing");
  block.style.width = "";
  block.style.height = "";
  inner.style.width = "";
  change();
  if (!shown || reduced) return;
  const after = block.getBoundingClientRect();
  if (Math.abs(after.width - before.width) < 1 && Math.abs(after.height - before.height) < 1) return;
  inner.style.width = after.width + "px";
  block.style.width = before.width + "px";
  block.style.height = before.height + "px";
  block.getBoundingClientRect();
  block.classList.add("sizing");
  block.style.width = after.width + "px";
  block.style.height = after.height + "px";
  clearTimeout(sizeTimer);
  sizeTimer = setTimeout(() => {
    block.classList.remove("sizing");
    block.style.width = "";
    block.style.height = "";
    inner.style.width = "";
  }, 360);
}

function say(id, text) {
  const el = $(id);
  if (el.textContent === text) return;
  el.textContent = text;
  el.classList.remove("fade");
  void el.offsetWidth;
  if (text) el.classList.add("fade");
}

function hide() {
  const card = $("card");
  if (!card.classList.contains("show")) return;
  card.classList.add("leaving");
  card.classList.remove("show");
  clearTimeout(leaveTimer);
  leaveTimer = setTimeout(() => card.classList.remove("leaving"), 400);
}

function render(m) {
  const card = $("card");
  clearTimeout(hideTimer);
  clearInterval(clock);

  if (!m || m.state === "idle") return hide();

  clearTimeout(leaveTimer);
  card.className = "card show " + m.state;

  resize(() => {
    say("title", m.title);
    say("amount", m.state === "ended" || m.state === "missed" ? "" : m.amount || "");
    say("message", m.state === "on-call" ? m.message || "" : "");

    if (m.state === "ringing") { say("label", "Incoming call"); callStart = 0; }
    if (m.state === "on-call") {
      callStart = Date.now();
      say("label", "On the line 0:00");
    }
    if (m.state === "ended") {
      say("label", callStart ? m.name + ", " + mmss(Date.now() - callStart) : m.name);
      callStart = 0;
    }
    if (m.state === "missed") say("label", "Missed call from " + m.name);
  });

  if (m.state === "on-call") {
    clock = setInterval(() => { $("label").textContent = "On the line " + mmss(Date.now() - callStart); }, 1000);
  }
  if (m.state === "ended" || m.state === "missed") hideTimer = setTimeout(hide, m.holdMs || 4000);
}

const es = new EventSource("/events?role=overlay");
es.onopen = () => { if (!inObs) document.body.classList.add("tab"); };
es.onerror = () => document.body.classList.remove("tab");
es.onmessage = (e) => {
  const m = JSON.parse(e.data);
  if (m.color) applyColor(m.color);
  if (m.type !== "overlay") return;
  if (m.state !== "idle") document.body.classList.remove("tab");
  render(m);
};
</script>
</body>
</html>
